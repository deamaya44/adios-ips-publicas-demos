apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: publico-tls
  namespace: demo-extra
spec:
  secretName: publico-tls
  dnsNames:
    - extra.tu-dominio.com
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    group: cert-manager.k8s.cloudflare.com
    kind: OriginIssuer
    name: cloudflare-origin-ca
