apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin
  namespace: demo-extra
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "app (solo lectura)",
          "Group": "Servers",
          "Host": "postgres",
          "Port": 5432,
          "MaintenanceDB": "app",
          "DBRestriction": "app",
          "Username": "lector",
          "PassFile": "/pgpass",
          "SSLMode": "disable"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: demo-extra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 5050
      initContainers:
        - name: pgpass
          image: dpage/pgadmin4:9.18
          command:
            - sh
            - -c
            - >-
              d=/var/lib/pgadmin/storage/lector_adios-ips.com &&
              mkdir -p "$d" &&
              printf 'postgres:5432:app:lector:%s\n' "$(cat /lector/password)" > "$d/pgpass" &&
              chmod 600 "$d/pgpass"
          volumeMounts:
            - name: datos
              mountPath: /var/lib/pgadmin
            - name: lector
              mountPath: /lector
              readOnly: true
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.18
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: lector@adios-ips.com
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin
                  key: password
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            periodSeconds: 10
          volumeMounts:
            - name: datos
              mountPath: /var/lib/pgadmin
            - name: servidores
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: datos
          emptyDir: {}
        - name: lector
          secret:
            secretName: postgres-lector
        - name: servidores
          configMap:
            name: pgadmin
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: demo-extra
spec:
  type: ClusterIP
  selector:
    app: pgadmin
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgadmin
  namespace: demo-extra
spec:
  parentRefs:
    - name: entrada
      namespace: nginx-gateway
      sectionName: https-interno
  hostnames:
    - pgadmin.interno.tu-dominio.com
  rules:
    - backendRefs:
        - name: pgadmin
          port: 80
